services:
  nobarfilm:
    container_name: nobarfilm
    image: ghcr.io/ridhoarmand/nobarfilm:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - SUBDL_API_KEY=${SUBDL_API_KEY:-}

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - proxy-tier

networks:
  proxy-tier:
    external: true

services:
  nobarfilm:
    container_name: nobarfilm
    image: ridhoarmand/nobarfilm:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CLIENT_URL=https://film.idho.eu.org
      - MOVIEBOX_MASTER_EMAIL=${MOVIEBOX_MASTER_EMAIL}
      - MOVIEBOX_MASTER_PASSWORD=${MOVIEBOX_MASTER_PASSWORD}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "--tries=1", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - proxy-tier

networks:
  proxy-tier:
    external: true